# ============================================================
# PostgreSQL 16 Lightweight Tuning Configuration
# Dirancang agar sangat ringan dan hemat RAM untuk server Apotek
# ============================================================

listen_addresses = '*'
max_connections = 30

# Memory Tuning (Minimal footprint)
shared_buffers = 64MB
work_mem = 2MB
maintenance_work_mem = 16MB
effective_cache_size = 128MB

# Write-Ahead Log (WAL) & Disk I/O
wal_buffers = 4MB
min_wal_size = 32MB
max_wal_size = 128MB
checkpoint_completion_target = 0.7

# Query Tuning
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging (Hanya log peringatan & error untuk menghemat disk I/O)
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_timezone = 'Asia/Jakarta'
timezone = 'Asia/Jakarta'
